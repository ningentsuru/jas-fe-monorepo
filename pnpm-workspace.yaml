packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@oxlint/binding-android-arm-eabi@1.75.0 || 1.76.0'
  - '@oxlint/binding-android-arm64@1.75.0 || 1.76.0'
  - '@oxlint/binding-darwin-arm64@1.75.0 || 1.76.0'
  - '@oxlint/binding-darwin-x64@1.75.0 || 1.76.0'
  - '@oxlint/binding-freebsd-x64@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-arm64-gnu@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-arm64-musl@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-riscv64-musl@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-s390x-gnu@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-x64-gnu@1.75.0 || 1.76.0'
  - '@oxlint/binding-linux-x64-musl@1.75.0 || 1.76.0'
  - '@oxlint/binding-openharmony-arm64@1.75.0 || 1.76.0'
  - '@oxlint/binding-win32-arm64-msvc@1.75.0 || 1.76.0'
  - '@oxlint/binding-win32-ia32-msvc@1.75.0 || 1.76.0'
  - '@oxlint/binding-win32-x64-msvc@1.75.0 || 1.76.0'
  - eslint-plugin-oxlint@1.75.0 || 1.76.0
  - oxlint@1.75.0 || 1.76.0
  - '@lucide/vue@1.27.0'
  - '@types/node@26.1.2'
  - '@types/react-dom@19.2.4'

overrides:
  sharp: "^0.35.3"
  postcss: "^8.5.23"
  brace-expansion: "^1.1.17"
